name: CI

# push only on main (plus tags): branch pushes already run via pull_request,
# so same-repo PRs are not checked twice
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (ui.test.tsx) pulls undici 8, which requires Node >= 22.19 —
          # on Node 20 the test worker crashes and every push fails
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
